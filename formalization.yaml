libraries:
  - name: "HoggarBound"
    track: "tracks/spectral-bounds"
    summary: "Formalization of Jonah's spectral floor (real/complex/quaternionic; prior work) for arbitrary supports, two-sided asymptotic half-violation limits (W, Q-, Q+, plus universal d(S)/L(S) <= 1/2 averaging upper bound), saturation equivalences, quantitative third-moment stability (`HoggarBound.Stability`), infinite non-closed CCZ family |Psi_{3m}> attaining the floor (contextual for m >= 2), exact binary optima 368 and 344 for one four-qubit C3 sign pair, N=4..5 ladders and lower bounds 1455 and 6444, known small degrees (TwoQubit & Hoggar witnesses), formal vertex-case membership + strict-law failure for one representative of each of the 9 vertex cases of Jonah's Conjecture E (N >= 4, `ConjectureECases.lean`; whole-case transfer via Jonah's Theorem B4, outside Lean), and NonVacuity + 8 kernel-proved false-variant refutations. The nine standalone finite-certificate modules (`Saturated*`, `C3Certificate`, `C3Spectra`, `C3Theorem`, `FlatData`, `PhaseData`) are compiled and axiom-audited in dedicated parallel CI jobs (`VerifyStandalone.lean`, `VerifyPhaseSeven.lean`)."
  - name: "ContextualityTensor"
    track: "tracks/disjoint-mermin"
    summary: "Exact contextuality degrees d_k = (7^k - 5^k)/2 (k disjoint Peres-Mermin squares) and (6^k - 4^k)/2 (k Mermin pentagrams) for the explicit union-context family, genuine minimum-defined asymptotics (`actual_*_min_epsilon_tends_to_one`), literal 2-qubit square and 3-qubit pentagram Pauli realizations (plus 4-qubit and 6-qubit disjoint bridges), and kernel-checked `HS(L(K_{3,3}))` / `HS(Petersen)` support identifications for all k (`SeedSupport.lean`), answering the stacking-limit question of Muller & Saniga (arXiv:2609.19862v1, Sec. 6; unreviewed preprint) for these two families."
  - name: "Evidence"
    track: "tracks/sequential-evidence"
    summary: "Formalization of two elementary bounds (Peres-Mermin setting-bias floor; finite betting-tree hitting bound, a finite form of Ville's inequality) and an exact counterexample to naive calibration."
