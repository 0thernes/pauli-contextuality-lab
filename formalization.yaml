    summary: "Formalization of Jonah's spectral floor (real/complex/quaternionic; prior work) for arbitrary supports, two-sided asymptotic half-violation limits (W, Q-, Q+, plus universal d(S)/L(S) <= 1/2 averaging upper bound), saturation equivalences, quantitative third-moment stability (`HoggarBound.Stability`), infinite non-closed CCZ family |Psi_{3m}> attaining the floor (contextual for m >= 2), exact binary optima 368 and 344 for one four-qubit C3 sign pair, N=4..5 ladders and lower bounds 1455 and 6444, known small degrees (TwoQubit & Hoggar witnesses), formal vertex-case membership + strict-law failure for one representative of each of the 9 vertex cases of Jonah's Conjecture E (N >= 4, `ConjectureECases.lean`; whole-case transfer via Jonah's Theorem B4, outside Lean), Theorems 23-25 (`TrialityResiduals.lean`: exact degrees 0, 210, 252, 252 across all four 315-line deletions of Q+(7,2); `PGRigidity.lean`: all-N PG(N-1,2) imaginary-completion no-go bound forcing >= 166,115,415 on W(15,2); `DesarguesQuasiQuadric.lean`: universal all-N [DHOP] fiber-flip two-character law, Desargues (10_3), ovoid parabola 1575-256k+32k^2, decoupling of red_8(XIXX), and sharp brackets K_95 in [53,55], K_103 in [87,107], S_B^(4) in [112,123], S_B^+ in [121,127]), and NonVacuity (13 witnesses + 11 kernel-proved false-variant refutations). The nine standalone finite-certificate modules (`Saturated*`, `C3Certificate`, `C3Spectra`, `C3Theorem`, `FlatData`, `PhaseData`) are compiled and axiom-audited in dedicated parallel CI jobs (`VerifyStandalone.lean`, `VerifyPhaseSeven.lean`)."
