name: Release Checksums & SLSA Provenance Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ "$file" = "$tag" ] || echo "::warning::VERSION ($file) does not match tag ($tag)"
          grep -Eq "^## \[$tag\]" CHANGELOG.md || echo "::warning::CHANGELOG.md has no section for $tag"
      - name: Collect release artifacts and generate SHA256SUMS
        run: |
          mkdir -p release-dist
          cp papers/spectral-bounds/unified-contextuality.pdf release-dist/
          cp papers/spectral-bounds/c3-spectral-counterexample.pdf release-dist/
          cp papers/disjoint-mermin/contextuality-tensor.pdf release-dist/
          cp papers/sequential-evidence/whitepaper.pdf release-dist/
          cp results/lean-axioms-all.log release-dist/
          cp data/MANIFEST.sha256 release-dist/data-MANIFEST.sha256
          if [ -f ERRATA.md ]; then cp ERRATA.md release-dist/; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REPOSITORY#*/}"
            git archive --format=tar.gz --prefix="$name-${GITHUB_REF_NAME}/" -o "release-dist/$name-${GITHUB_REF_NAME}-source.tar.gz" "${GITHUB_REF_NAME}"
            git archive --format=zip --prefix="$name-${GITHUB_REF_NAME}/" -o "release-dist/$name-${GITHUB_REF_NAME}-source.zip" "${GITHUB_REF_NAME}"
          fi
          (cd release-dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS)
          cat release-dist/SHA256SUMS
      - name: Generate Sigstore SLSA build provenance attestations
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: release-dist/*
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Automated release of Pauli Contextuality Lab ${GITHUB_REF_NAME}." > notes.md
          {
            echo
            echo "Verify checksums: \`sha256sum -c SHA256SUMS\` and (on public repos) \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          } >> notes.md
      - name: Publish GitHub Release with SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-dist/* \
            --title "Pauli Contextuality Lab $TAG" \
            --notes-file notes.md \
            --verify-tag \
            || gh release upload "$TAG" release-dist/* --clobber
