name: Lean 4.35.0 Formal Verification & 6-Kernel Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-verify:
    name: Build, Axiom Audit, Batteries Linter & 6-Kernel Comparator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install bubblewrap for sandboxed lake comparator
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Fetch pinned Mathlib cache & build all 3 libraries + CarrierFamily
        working-directory: lean
        run: |
          lake exe cache get
          lake build HoggarBound HoggarBound.CarrierFamily ContextualityTensor Evidence Solution
      - name: Forbidden-token scan (comment- and string-aware nested lexer)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          def strip_lean_comments(src: str) -> str:
              out, i, n, depth, in_str = [], 0, len(src), 0, False
              while i < n:
                  if depth > 0:
                      if src[i:i+2] == "/-":
                          depth += 1; i += 2
                      elif src[i:i+2] == "-/":
                          depth -= 1; i += 2
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  elif in_str:
                      if src[i] == "\\" and i + 1 < n:
                          i += 2
                      elif src[i] == '"':
                          in_str = False; i += 1
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  else:
                      if src[i:i+2] == "/-":
                          depth = 1; i += 2
                      elif src[i:i+2] == "--":
                          while i < n and src[i] != "\n": i += 1
                      elif src[i] == '"':
                          in_str = True; i += 1
                      else:
                          out.append(src[i]); i += 1
              return "".join(out)

          forbidden = re.compile(r"\b(sorry|admit|native_decide|unsafe)\b|^\s*(?:private\s+|protected\s+)?axiom\b|implemented_by|@\[extern")
          roots = [
              Path("lean/HoggarBound"),
              Path("lean/ContextualityTensor"),
              Path("lean/Evidence"),
              Path("lean/Solution.lean"),
              Path("lean/HoggarBound.lean"),
              Path("lean/ContextualityTensor.lean"),
              Path("lean/Evidence.lean"),
          ]
          hits = []
          for item in roots:
              files = [item] if item.is_file() else sorted(item.rglob("*.lean"))
              for f in files:
                  cleaned = strip_lean_comments(f.read_text(encoding="utf-8"))
                  for lineno, line in enumerate(cleaned.splitlines(), 1):
                      if forbidden.search(line):
                          hits.append(f"{f}:{lineno}: {line.strip()}")
          if hits:
              print("Forbidden Lean token detected:", file=sys.stderr)
              for h in hits:
                  print(" ", h, file=sys.stderr)
              sys.exit(1)
          print("PASS: 0 forbidden Lean tokens across all proof modules (nested-comment & string-aware scan).")
          PY
      - name: Run unified exhaustive #print axioms audit (VerifyAll.lean)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyAll.lean | tee ../results/lean-axioms-ci.log
      - name: Verify live CI axiom log & committed README sync
        run: |
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-ci.log --require-exhaustive
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-all.log --require-exhaustive
      - name: Run Batteries linter (report-only)
        working-directory: lean
        continue-on-error: true
        run: lake exe runLinter ContextualityTensor Evidence
      - name: Run 6-kernel lake comparator --paranoid
        working-directory: lean
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid
      - name: Attest Lean axiom audit report (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: results/lean-axioms-ci.log
