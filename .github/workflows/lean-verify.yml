name: Lean 4.35.0 Formal Verification & 6-Kernel Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-verify:
    name: Build, Axiom Audit, Adversarial Test, Batteries Linter & 6-Kernel Comparator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install bubblewrap for sandboxed lake comparator
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Fetch pinned Mathlib cache & build all 3 libraries + Solution + VerifyAll
        working-directory: lean
        run: |
          lake exe cache get
          lake build HoggarBound ContextualityTensor Evidence Solution VerifyAll
      - name: Forbidden-token scan (comment- and string-aware nested lexer; Playbook v1.3 H46)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          def strip_lean_comments(src: str) -> str:
              out, i, n, depth, in_str = [], 0, len(src), 0, False
              while i < n:
                  if depth > 0:
                      if src[i:i+2] == "/-":
                          depth += 1; i += 2
                      elif src[i:i+2] == "-/":
                          depth -= 1; i += 2
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  elif in_str:
                      if src[i] == "\\" and i + 1 < n:
                          i += 2
                      elif src[i] == '"':
                          in_str = False; i += 1
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  else:
                      if src[i:i+2] == "/-":
                          depth = 1; i += 2
                      elif src[i:i+2] == "--":
                          while i < n and src[i] != "\n": i += 1
                      elif src[i] == '"':
                          in_str = True; i += 1
                      else:
                          out.append(src[i]); i += 1
              return "".join(out)

          forbidden = re.compile(
              r"\b(sorry|admit|native_decide|unsafe)\b|"
              r"^\s*(?:(?:private|protected|noncomputable|scoped|local)\s+)*axiom\b|"
              r"implemented_by|@\[extern"
          )
          roots = [
              Path("lean/HoggarBound"),
              Path("lean/ContextualityTensor"),
              Path("lean/Evidence"),
              Path("lean/Solution.lean"),
              Path("lean/HoggarBound.lean"),
              Path("lean/ContextualityTensor.lean"),
              Path("lean/Evidence.lean"),
              Path("lean/VerifyAll.lean"),
              Path("lean/VerifyStandalone.lean"),
              Path("lean/VerifyPhaseSeven.lean"),
          ]
          hits = []
          for item in roots:
              files = [item] if item.is_file() else sorted(item.rglob("*.lean"))
              for f in files:
                  if ".lake" in f.parts:
                      continue
                  cleaned = strip_lean_comments(f.read_text(encoding="utf-8"))
                  for lineno, line in enumerate(cleaned.splitlines(), 1):
                      if forbidden.search(line):
                          hits.append(f"{f}:{lineno}: {line.strip()}")
          if hits:
              print("Forbidden Lean token detected:", file=sys.stderr)
              for h in hits:
                  print(" ", h, file=sys.stderr)
              sys.exit(1)
          print("PASS: 0 forbidden Lean tokens across all proof modules (nested-comment & string-aware scan).")
          PY
      - name: Run unified exhaustive #print axioms audit (VerifyAll.lean; full output retained)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyAll.lean 2>&1 | tee ../results/lean-axioms-ci.log
      - name: Verify live CI axiom log & committed README sync
        run: |
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-ci.log --require-exhaustive
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-all.log --require-exhaustive
      - name: Negative Lean sanity checks (closed decidable facts)
        working-directory: lean
        shell: bash
        run: |
          set +e
          out1=$(lake env lean --stdin 2>&1 <<'LEAN'
          import ContextualityTensor
          theorem sanity_false_square_degree :
              ContextualityTensor.violations (fun _ : Fin 1 => ContextualityTensor.squareResponse (fun _ => false)) = 0 := by
            decide
          LEAN
          ); rc1=$?
          out2=$(lake env lean --stdin 2>&1 <<'LEAN'
          import Evidence.Square
          theorem sanity_false_concrete_win :
              Evidence.loses (fun _ => false) 5 = false := by
            decide
          LEAN
          ); rc2=$?
          out3=$(lake env lean --stdin 2>&1 <<'LEAN'
          import HoggarBound.Quadric
          theorem sanity_false_qform_zero :
              HoggarBound.qform (0 : HoggarBound.Pt 2) = 1 := by
            decide
          LEAN
          ); rc3=$?
          set -e
          for pair in "1:$rc1:$out1" "2:$rc2:$out2" "3:$rc3:$out3"; do
            idx="${pair%%:*}"
            rest="${pair#*:}"
            rc="${rest%%:*}"
            msg="${rest#*:}"
            if [ "$rc" -eq 0 ] || ! printf '%s' "$msg" | grep -q "proved that the proposition"; then
              echo "ERROR: Sanity check $idx did not reject false closed fact (rc=$rc): $msg" >&2
              exit 1
            fi
          done
          echo "PASS: All 3 negative Lean sanity checks (closed decidable facts) were rejected by kernel decide."
      - name: Live tamper-injection negative gate (evil axiom / sorry / ofReduceBool rejection)
        working-directory: lean
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, tempfile
          from pathlib import Path

          # 1. Plant an evil custom axiom into a temporary Lean file and verify live Lean
          #    #print axioms exposes it, our H46 lexer catches it, and check_readme_axioms.py rejects it.
          with tempfile.NamedTemporaryFile("w", suffix=".lean", dir=".", delete=False, encoding="utf-8") as tf:
              tf.write("axiom evil_tamper_axiom : False\ntheorem tampered_thm : False := evil_tamper_axiom\n#print axioms tampered_thm\n")
              tpath = Path(tf.name)
          with tempfile.NamedTemporaryFile("w", suffix=".log", dir=".", delete=False, encoding="utf-8") as lf:
              lpath = Path(lf.name)
          try:
              res = subprocess.run(["lake", "env", "lean", str(tpath)], capture_output=True, text=True, check=False)
              out = res.stdout + res.stderr
              if "evil_tamper_axiom" not in out:
                  print(f"ERROR: Lean did not report planted custom axiom! out={out}", file=sys.stderr)
                  sys.exit(1)
              forb = re.compile(
                  r"\b(sorry|admit|native_decide|unsafe)\b|"
                  r"^\s*(?:(?:private|protected|noncomputable|scoped|local)\s+)*axiom\b|"
                  r"implemented_by|@\[extern"
              )
              if not any(forb.search(line) for line in tpath.read_text(encoding="utf-8").splitlines()):
                  print("ERROR: H46 forbidden-token lexer failed to catch planted custom axiom!", file=sys.stderr)
                  sys.exit(1)
              # 2. Inject the poisoned #print axioms line into a copy of lean-axioms-ci.log
              #    and assert scripts/check_readme_axioms.py actively REJECTS it non-zero.
              base_log = Path("../results/lean-axioms-ci.log").read_text(encoding="utf-8")
              lpath.write_text(base_log + "\n'tampered_thm' depends on axioms: [evil_tamper_axiom]\n", encoding="utf-8")
              chk = subprocess.run(
                  ["python3", "../scripts/check_readme_axioms.py", "--log", str(lpath), "--require-exhaustive"],
                  capture_output=True, text=True, check=False,
              )
              if chk.returncode == 0:
                  print("ERROR: check_readme_axioms.py accepted a poisoned axiom log!", file=sys.stderr)
                  sys.exit(1)
              print("PASS: Live tamper-injection gate caught planted custom axiom via Lean kernel, H46 lexer, and check_readme_axioms.py.")
          finally:
              tpath.unlink(missing_ok=True)
              lpath.unlink(missing_ok=True)
          PY
      - name: Run Batteries linter across 18 clean modules (report-only)
        working-directory: lean
        continue-on-error: true
        run: |
          lake exe runLinter HoggarBound.Moment HoggarBound.Pauli HoggarBound.Bound HoggarBound.Counting HoggarBound.Corollaries
          lake exe runLinter HoggarBound.Quadric HoggarBound.Kramers HoggarBound.Stability ContextualityTensor Evidence
          lake exe runLinter ContextualityTensor.Support ContextualityTensor.UnionModel ContextualityTensor.Asymptotics ContextualityTensor.ActualModel ContextualityTensor.GeneralTheory
          lake exe runLinter HoggarBound.PGRigidity HoggarBound.TrialityResiduals HoggarBound.DesarguesQuasiQuadric
      - name: Run 6-kernel lake comparator --paranoid
        working-directory: lean
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid
      - name: Attest Lean axiom audit report (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: results/lean-axioms-ci.log

  lean-verify-standalone:
    name: Standalone Track 1 Certificates (Saturated 4/5-Qubit & 4-Qubit C3 Spectra)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache & build VerifyStandalone (8 standalone Track 1 modules)
        working-directory: lean
        run: |
          lake exe cache get
          lake build VerifyStandalone
      - name: Run standalone finite-certificate & C3 spectral axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyStandalone.lean 2>&1 | tee ../results/lean-axioms-standalone-ci.log
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          txt = Path("../results/lean-axioms-standalone-ci.log").read_text(encoding="utf-8")
          if "STANDALONE_AXIOM_AUDIT_PASS:" not in txt:
              print("ERROR: missing STANDALONE_AXIOM_AUDIT_PASS sentinel", file=sys.stderr)
              sys.exit(1)
          unwrapped = re.sub(r",\n\s+", ", ", txt)
          checked = 0
          for line in unwrapped.splitlines():
              m = re.match(r"^'([^']+)' depends on axioms: \[(.*)\]$", line.strip())
              if m:
                  checked += 1
                  bad = {a.strip() for a in m.group(2).split(",") if a.strip()} - allowed
                  if bad:
                      print(f"Disallowed axiom in {m.group(1)}: {sorted(bad)}", file=sys.stderr)
                      sys.exit(1)
          if checked < 16:
              print(f"Expected >= 16 standalone declarations, got {checked}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: {checked} standalone Track 1 finite-certificate & C3 spectral theorems strictly within {sorted(allowed)}.")
          PY
      - name: Attest standalone Lean axiom audit (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: results/lean-axioms-standalone-ci.log

  lean-verify-phase7:
    name: Seven-Qubit Phase-State Certificate (SaturatedPhaseSeven, degree 729344)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache & build VerifyPhaseSeven (SaturatedPhaseSeven)
        working-directory: lean
        run: |
          lake exe cache get
          lake build VerifyPhaseSeven
      - name: Run seven-qubit phase-state axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyPhaseSeven.lean 2>&1 | tee ../results/lean-axioms-phase7-ci.log
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          txt = Path("../results/lean-axioms-phase7-ci.log").read_text(encoding="utf-8")
          if "PHASE7_AXIOM_AUDIT_PASS:" not in txt:
              print("ERROR: missing PHASE7_AXIOM_AUDIT_PASS sentinel", file=sys.stderr)
              sys.exit(1)
          unwrapped = re.sub(r",\n\s+", ", ", txt)
          checked = 0
          for line in unwrapped.splitlines():
              m = re.match(r"^'([^']+)' depends on axioms: \[(.*)\]$", line.strip())
              if m:
                  checked += 1
                  bad = {a.strip() for a in m.group(2).split(",") if a.strip()} - allowed
                  if bad:
                      print(f"Disallowed axiom in {m.group(1)}: {sorted(bad)}", file=sys.stderr)
                      sys.exit(1)
          if checked < 5:
              print(f"Expected >= 5 phase7 declarations, got {checked}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: {checked} seven-qubit phase-state theorems strictly within {sorted(allowed)}.")
          PY
      - name: Attest seven-qubit phase-state axiom audit (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: results/lean-axioms-phase7-ci.log
