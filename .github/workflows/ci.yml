name: CI (Cross-Platform Tests, C11 Sanitizers, Security & Build Standard v1.2.0)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly drift & vulnerability check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unified pytest suite (exact, property, negative, mutation/fuzz, integrity)
        run: python -m pytest -v tests/
      - name: Run Node.js web-model unit tests
        run: node --test tests/test_web_models.mjs
      - name: Run all-track exact verification
        run: python scripts/verify_all.py
      - name: Run arithmetic, citation, axiom-sync, timestamp, blueprint, and site-link audits
        run: |
          python scripts/arithmetic_audit.py
          python scripts/check_citations.py
          python scripts/check_readme_axioms.py
          python scripts/stamp_timestamps.py --verify
          python scripts/build_blueprint.py
          python scripts/build_site.py

  c11-sanitizers-and-lint:
    name: C11 ASan/UBSan, Linters & Build Standard v1.2.0 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile & run all 15 C11 engines with -Wall -Wextra and ASan/UBSan
        run: |
          mkdir -p build/san
          QR=third_party/quantum_rng/src/quantum_rng
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/hoggar.c "$QR/quantum_rng.c" -I"$QR" -lm -o build/san/hoggar_san
          ./build/san/hoggar_san table 4
          ./build/san/hoggar_san exhaust2
          ./build/san/hoggar_san lines 2 f >/dev/null
          ./build/san/hoggar_san falsify 2 f 42 5 50
          ./build/san/hoggar_san verify 4 f data/witness/n4_f.txt
          ./build/san/hoggar_san verify 4 h data/witness/n4_h.txt
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
            tracks/spectral-bounds/src/w52_census_verify.c -lm -o build/san/w52_san
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
            tracks/spectral-bounds/src/third_level.c -lm -o build/san/third_level_san
          ./build/san/third_level_san
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/orbits7.c -o build/san/orbits7_san
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/legacy-search/wcheck.c -o build/san/wcheck_san
          ./build/san/wcheck_san data/witness/n4_f.txt data/witness/n4_h.txt
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/legacy-search/exhaust.c -o build/san/exhaust_san
          ./build/san/exhaust_san 2 f
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ithird_party/qgtl/include -Ithird_party/qgtl/stub \
            third_party/qgtl/src/quantum_geometric/distributed/differential_geometry.c \
            tracks/spectral-bounds/src/qgt_hoggar.c -lm -o build/san/qgt_hoggar_san
          ./build/san/qgt_hoggar_san data/witness/n3_f_hoggar_moonlab.txt data/witness/n4_h_hoggar_moonlab.txt
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ithird_party/qgtl/include -Ithird_party/qgtl/stub \
            third_party/qgtl/src/quantum_geometric/distributed/differential_geometry.c \
            tracks/spectral-bounds/src/qgt_flat.c -lm -o build/san/qgt_flat_san
          ./build/san/qgt_flat_san --no-seven | grep -q "QGT-FLAT-PASS"
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/legacy-search/tabu.c -lm -o build/san/tabu_san
          ./build/san/tabu_san 2 f 42 0.05 /tmp/tabu_san_out.txt | grep -q "recount="
          rm -f /tmp/tabu_san_out.txt
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/disjoint-mermin/src/stack_qrng.c "$QR/quantum_rng.c" -I"$QR" -lm -o build/san/dm_qrng_san
          ./build/san/dm_qrng_san 20261109 64 >/dev/null
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/family7.c -o build/san/family7_san
          ./build/san/family7_san 0 2 >/dev/null
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/sample7.c -o build/san/sample7_san
          ./build/san/sample7_san 0 3 200 42 >/dev/null
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/n9_rank8_search.c -o build/san/n9_rank8_san
          ./build/san/n9_rank8_san --smoke >/dev/null
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/qrng_stream.c "$QR/quantum_rng.c" -I"$QR" -lm -o build/san/qrng_stream_san
          ./build/san/qrng_stream_san 42 64 >/dev/null
          cc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            tracks/spectral-bounds/src/w15_verify.c -o build/san/w15_san
          ./build/san/w15_san data/witness/n8_f_l4_opt.txt data/witness/n8_h_l4_opt.txt | grep -q "161360335"
      - name: Report-only linters (ruff & mypy)
        continue-on-error: true
        run: |
          python -m ruff check scripts/ tests/
          python -m ruff check --select E9,F821,F822,F823,B tracks/
          python -m mypy --ignore-missing-imports scripts/
      - name: Build Standard v1.2.0 repo audit (report-only)
        run: bash scripts/audit-repo.sh . --json audit.json --markdown "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        with:
          name: build-standard-audit
          path: audit.json

  security:
    name: Security scan (SHA-256 verified, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks v8.30.1 (SHA-256 verified, full history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          echo "gitleaks findings: $(grep -c '"RuleID"' gitleaks.json || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: osv-scanner v2.7.1 (SHA-256 verified, dependency vulnerability check)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --recursive . > osv.txt 2>&1 || true
          { echo '### osv-scanner'; echo '```'; tail -n 40 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gitleaks.json
            osv.txt
